<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background: #0f172a;">
  <rect width="600" height="450" fill="#0f172a" rx="12"/>
  
  <text x="300" y="40" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Model Evaluation: Confusion Matrix</text>
  <text x="300" y="65" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Random Forest Classifier (Test Set N=114)</text>

  <!-- Headers -->
  <text x="140" y="110" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Predicted Benign</text>
  <text x="340" y="110" fill="#fb7185" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Predicted Malignant</text>

  <!-- Row 1: Actual Benign -->
  <g transform="translate(40, 130)">
    <text x="0" y="55" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700">Actual</text>
    <text x="0" y="70" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Benign</text>
    
    <!-- True Negative Cell -->
    <rect x="50" y="0" width="180" height="110" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" />
    <text x="140" y="50" fill="#34d399" font-family="sans-serif" font-size="32" font-weight="800" text-anchor="middle">71</text>
    <text x="140" y="75" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">True Negative (62.3%)</text>

    <!-- False Positive Cell -->
    <rect x="250" y="0" width="180" height="110" rx="8" fill="rgba(244, 63, 94, 0.08)" stroke="#475569" stroke-width="1" />
    <text x="340" y="50" fill="#94a3b8" font-family="sans-serif" font-size="32" font-weight="800" text-anchor="middle">1</text>
    <text x="340" y="75" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">False Positive (0.9%)</text>
  </g>

  <!-- Row 2: Actual Malignant -->
  <g transform="translate(40, 260)">
    <text x="0" y="55" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700">Actual</text>
    <text x="0" y="70" fill="#fb7185" font-family="sans-serif" font-size="12" font-weight="700">Malignant</text>
    
    <!-- False Negative Cell -->
    <rect x="50" y="0" width="180" height="110" rx="8" fill="rgba(244, 63, 94, 0.08)" stroke="#475569" stroke-width="1" />
    <text x="140" y="50" fill="#94a3b8" font-family="sans-serif" font-size="32" font-weight="800" text-anchor="middle">2</text>
    <text x="140" y="75" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">False Negative (1.8%)</text>

    <!-- True Positive Cell -->
    <rect x="250" y="0" width="180" height="110" rx="8" fill="rgba(244, 63, 94, 0.25)" stroke="#f43f5e" stroke-width="2" />
    <text x="340" y="50" fill="#fb7185" font-family="sans-serif" font-size="32" font-weight="800" text-anchor="middle">40</text>
    <text x="340" y="75" fill="#fecdd3" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">True Positive (35.1%)</text>
  </g>

  <!-- Summary Stats -->
  <text x="300" y="415" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Overall Test Accuracy: 97.37% | Sensitivity: 95.2% | Specificity: 98.6%</text>
</svg>
