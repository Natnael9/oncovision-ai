<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background: #090d16;">
  <defs>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#090d16" rx="12"/>
  
  <!-- Tissue Layer Background -->
  <path d="M 50 350 Q 200 300 400 340 T 750 320 L 750 450 L 50 450 Z" fill="#1e1b4b" opacity="0.6"/>
  <path d="M 50 380 Q 300 340 500 390 T 750 370 L 750 450 L 50 450 Z" fill="#31103f" opacity="0.7"/>

  <!-- Tumor Nodular Cluster -->
  <circle cx="480" cy="360" r="65" fill="#881337" opacity="0.8" />
  <circle cx="460" cy="340" r="35" fill="#be123c" opacity="0.9" />
  <circle cx="500" cy="380" r="40" fill="#e11d48" opacity="0.7" />

  <!-- Cell Nuclei inside lump -->
  <circle cx="450" cy="335" r="8" fill="#fda4af" />
  <circle cx="475" cy="345" r="9" fill="#fda4af" />
  <circle cx="490" cy="370" r="10" fill="#fda4af" />
  <circle cx="460" cy="380" r="7" fill="#fda4af" />

  <!-- Syringe Barrel & Needle -->
  <g transform="translate(180, 100) rotate(35)">
    <!-- Needle Shaft -->
    <rect x="0" y="24" width="280" height="4" fill="url(#needleGrad)" />
    <!-- Beveled Needle Tip -->
    <polygon points="280,24 295,26 280,28" fill="#e2e8f0" />
    <!-- Syringe Hub -->
    <rect x="-20" y="14" width="20" height="24" rx="3" fill="#0284c7" />
    <!-- Glass Barrel -->
    <rect x="-180" y="10" width="160" height="32" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2" />
    <!-- Aspirated Cell Fluid -->
    <rect x="-80" y="12" width="60" height="28" fill="rgba(244, 63, 94, 0.4)" />
    <!-- Plunger Rod -->
    <rect x="-250" y="20" width="70" height="12" fill="#64748b" />
    <rect x="-260" y="10" width="10" height="32" fill="#0284c7" />
  </g>

  <!-- Labels and Callouts -->
  <g font-family="sans-serif">
    <text x="50" y="60" fill="#38bdf8" font-size="20" font-weight="700">STAGE 1: Fine Needle Aspiration (FNA)</text>
    <text x="50" y="90" fill="#94a3b8" font-size="14">21–25 Gauge Precision Needle Extraction of Palpable Lesion Fluid</text>

    <line x1="480" y1="360" x2="620" y2="240" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="620" cy="240" r="4" fill="#f43f5e" />
    <rect x="620" y="210" width="150" height="50" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1" />
    <text x="630" y="232" fill="#fb7185" font-size="12" font-weight="700">Target Cellular Cluster</text>
    <text x="630" y="248" fill="#94a3b8" font-size="11">Cohesive epithelial cells</text>
  </g>
</svg>
