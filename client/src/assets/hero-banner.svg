<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background: #020617;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Abstract DNA / Cellular Mesh Graphic -->
  <g transform="translate(600, 315)">
    <!-- Concentric Target Orbits -->
    <circle r="240" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8,8" />
    <circle r="180" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.4" />
    <circle r="120" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5" />

    <!-- Active Contour Snake Lines -->
    <path d="M -150 -60 Q -80 -180 50 -150 T 180 20 T 90 160 T -110 130 Z" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <path d="M -100 -40 Q -40 -120 40 -90 T 120 10 T 60 100 T -70 80 Z" fill="rgba(56, 189, 248, 0.08)" stroke="#f43f5e" stroke-width="2" />

    <!-- Cell Nuclei Nodes -->
    <circle cx="-150" cy="-60" r="10" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="50" cy="-150" r="14" fill="#f43f5e" filter="url(#glow)" />
    <circle cx="180" cy="20" r="8" fill="#38bdf8" />
    <circle cx="90" cy="160" r="12" fill="#38bdf8" />
    <circle cx="-110" cy="130" r="9" fill="#f43f5e" />
    <circle cx="0" cy="0" r="22" fill="url(#cyanGrad)" filter="url(#glow)" />

    <!-- Feature Vector Lines -->
    <line x1="0" y1="0" x2="-150" y2="-60" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,3" />
    <line x1="0" y1="0" x2="50" y2="-150" stroke="#f43f5e" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,3" />
    <line x1="0" y1="0" x2="180" y2="20" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,3" />
    <line x1="0" y1="0" x2="90" y2="160" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,3" />

    <!-- Diagnostic Data Floating Badges -->
    <g transform="translate(180, -180)">
      <rect x="0" y="0" width="170" height="46" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="15" y="20" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">ACCURACY</text>
      <text x="15" y="38" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="800">97.37% RF</text>
    </g>

    <g transform="translate(-320, 120)">
      <rect x="0" y="0" width="190" height="46" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1" />
      <text x="15" y="20" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">CLASSIFICATION</text>
      <text x="15" y="38" fill="#fb7185" font-family="sans-serif" font-size="16" font-weight="800">30 Morphometrics</text>
    </g>
  </g>

  <!-- Overlay Header Text -->
  <text x="60" y="100" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="3">WISCONSIN DIAGNOSTIC BREAST CANCER (WDBC)</text>
  <text x="60" y="145" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="800">OncoVision AI Pathology Engine</text>
</svg>
