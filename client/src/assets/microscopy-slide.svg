<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background: #14252a;">
  <defs>
    <radialGradient id="cellSphere3D" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1d3b41" />
      <stop offset="40%" stop-color="#13262a" />
      <stop offset="85%" stop-color="#0b171a" />
      <stop offset="100%" stop-color="#060c0e" />
    </radialGradient>
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="#14252a" rx="12"/>

  <!-- Left 3D Cell Sphere Viewport -->
  <g transform="translate(100, 250)">
    <circle r="180" fill="url(#cellSphere3D)" stroke="#00e5ce" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
    <circle r="140" fill="none" stroke="#00e5ce" stroke-width="1" opacity="0.3" />
    <circle r="90" fill="none" stroke="#00e5ce" stroke-width="1" opacity="0.2" />
  </g>

  <!-- Right 3D Cell Sphere Viewport -->
  <g transform="translate(700, 250)">
    <circle r="180" fill="url(#cellSphere3D)" stroke="#00e5ce" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
    <circle r="140" fill="none" stroke="#00e5ce" stroke-width="1" opacity="0.3" />
    <circle r="90" fill="none" stroke="#00e5ce" stroke-width="1" opacity="0.2" />
  </g>

  <!-- Center Active Microscope Viewport -->
  <g transform="translate(400, 250)">
    <circle r="130" fill="#0f1d21" stroke="#00e5ce" stroke-width="3" filter="url(#glowTeal)" />
    
    <!-- Crosshairs -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#00e5ce" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#00e5ce" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />

    <!-- Cell Contour Nuclei -->
    <path d="M -30 -20 Q -10 -50 40 -30 T 40 30 T -20 40 Z" fill="rgba(0, 229, 206, 0.2)" stroke="#00e5ce" stroke-width="2.5" />
    <circle cx="0" cy="0" r="4" fill="#00e5ce" />
    
    <path d="M -50 20 Q -20 0 10 30 T -30 60 Z" fill="rgba(244, 63, 94, 0.25)" stroke="#f43f5e" stroke-width="2" />
    
    <rect x="-80" y="90" width="160" height="26" rx="6" fill="#0d4044" stroke="#00e5ce" stroke-width="1" />
    <text x="0" y="107" fill="#00e5ce" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">ACTIVE SNAKE CONTOUR</text>
  </g>

  <text x="400" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Stage 2 &amp; 3: Computer Vision Segmentation</text>
  <text x="400" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">Wright-Giemsa Stained Nuclei Boundary Detection</text>
</svg>
