<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background: #090d16;">
  <rect width="800" height="500" fill="#090d16" rx="12"/>
  
  <text x="50" y="60" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="700">STAGE 2 &amp; 3: Microscopy &amp; Active Contour Segmentation</text>
  <text x="50" y="90" fill="#94a3b8" font-family="sans-serif" font-size="14">Wright-Giemsa Stained Nuclei with Snake Algorithm Boundary Contours</text>

  <!-- Microscope Viewport Lens Circle -->
  <g transform="translate(400, 290)">
    <circle r="170" fill="#020617" stroke="#0284c7" stroke-width="4" />
    <circle r="168" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />

    <!-- Grid Crosshair -->
    <line x1="-170" y1="0" x2="170" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="0" y1="-170" x2="0" y2="170" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Stained Cell Nuclei with Snake Contours -->
    <!-- Nucleus 1 (Malignant irregular contour) -->
    <g transform="translate(-50, -40)">
      <path d="M -40 -10 Q -20 -45 30 -35 T 50 20 T -10 45 T -50 10 Z" fill="rgba(192, 38, 211, 0.4)" stroke="#f43f5e" stroke-width="2.5" />
      <!-- Center node & Radius vectors -->
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <line x1="0" y1="0" x2="30" y2="-35" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2" />
      <line x1="0" y1="0" x2="-40" y2="-10" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2" />
      <text x="-15" y="-50" fill="#fb7185" font-family="sans-serif" font-size="10" font-weight="700">Concave Indentation</text>
    </g>

    <!-- Nucleus 2 (Regular Benign shape) -->
    <g transform="translate(60, 40)">
      <ellipse cx="0" cy="0" rx="35" ry="28" fill="rgba(147, 51, 234, 0.35)" stroke="#10b981" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#10b981" />
    </g>

    <!-- Nucleus 3 -->
    <g transform="translate(-60, 70)">
      <path d="M -25 -15 Q 0 -30 25 -10 T 20 25 T -20 20 Z" fill="rgba(147, 51, 234, 0.35)" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" />
    </g>

    <!-- Magnification Scale Badge -->
    <rect x="-150" y="120" width="90" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="-142" y="136" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">40x OPTICAL</text>
  </g>
</svg>
