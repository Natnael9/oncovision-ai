<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background: #0f172a;">
  <rect width="600" height="450" fill="#0f172a" rx="12"/>
  
  <text x="300" y="40" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Receiver Operating Characteristic (ROC) Curve</text>
  <text x="300" y="65" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Random Forest Classifier AUC = 0.99</text>

  <!-- Plot Axes -->
  <g transform="translate(80, 80)">
    <!-- Grid lines -->
    <line x1="0" y1="0" x2="440" y2="0" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="70" x2="440" y2="70" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="140" x2="440" y2="140" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="210" x2="440" y2="210" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="280" x2="440" y2="280" stroke="#334155" stroke-width="2" />

    <line x1="0" y1="0" x2="0" y2="280" stroke="#334155" stroke-width="2" />
    <line x1="110" y1="0" x2="110" y2="280" stroke="#1e293b" stroke-width="1" />
    <line x1="220" y1="0" x2="220" y2="280" stroke="#1e293b" stroke-width="1" />
    <line x1="330" y1="0" x2="330" y2="280" stroke="#1e293b" stroke-width="1" />
    <line x1="440" y1="0" x2="440" y2="280" stroke="#1e293b" stroke-width="1" />

    <!-- Chance Diagonal (AUC 0.50) -->
    <line x1="0" y1="280" x2="440" y2="0" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- ROC Curve (AUC 0.99) -->
    <path d="M 0 280 Q 5 20 40 8 T 440 0" fill="none" stroke="#06b6d4" stroke-width="3.5" />
    <path d="M 0 280 Q 5 20 40 8 T 440 0 L 440 280 Z" fill="rgba(6, 182, 212, 0.12)" />

    <!-- Axis Labels -->
    <text x="220" y="320" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">False Positive Rate (1 - Specificity)</text>
    <text x="-140" y="-45" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" transform="rotate(-90)">True Positive Rate (Sensitivity)</text>

    <!-- Ticks -->
    <text x="0" y="298" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">0.0</text>
    <text x="110" y="298" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">0.25</text>
    <text x="220" y="298" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">0.50</text>
    <text x="330" y="298" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">0.75</text>
    <text x="440" y="298" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">1.0</text>

    <text x="-12" y="284" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">0.0</text>
    <text x="-12" y="214" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">0.25</text>
    <text x="-12" y="144" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">0.50</text>
    <text x="-12" y="74" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">0.75</text>
    <text x="-12" y="4" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">1.0</text>

    <!-- Legend Badge -->
    <g transform="translate(240, 160)">
      <rect x="0" y="0" width="180" height="50" rx="6" fill="#020617" stroke="#06b6d4" stroke-width="1" />
      <line x1="15" y1="25" x2="45" y2="25" stroke="#06b6d4" stroke-width="3" />
      <text x="55" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Random Forest</text>
      <text x="55" y="38" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">AUC = 0.99</text>
    </g>
  </g>
</svg>
